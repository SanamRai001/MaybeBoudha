name: Vendor Phase 3P Panorama

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/vendor-phase-3p-panorama.yml"

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download public-domain Boudhanath surroundings
        run: |
          mkdir -p public/images
          curl --fail --location --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/P37275-Kathmandu-Boudhanath.jpg?width=2560" \
            --output public/images/boudha-surroundings.jpg

          test -s public/images/boudha-surroundings.jpg
          test "$(wc -c < public/images/boudha-surroundings.jpg)" -gt 100000
          file public/images/boudha-surroundings.jpg
          sha256sum public/images/boudha-surroundings.jpg

      - name: Commit vendored public-domain image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/boudha-surroundings.jpg
          git commit -m "chore(phase-3p): vendor public-domain Boudhanath panorama"
          git push origin HEAD:"${{ github.head_ref }}"
