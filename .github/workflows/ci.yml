name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lockfile-sync:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate exact npm lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git commit -m "chore(phase-2): repair generated npm lockfile"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve dependencies during lockfile repair
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  runtime-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve dependencies during lockfile repair
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/maybeboudha-preview.log 2>&1 &
          echo $! > /tmp/maybeboudha-preview.pid

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture Spark runtime
        run: |
          npx --yes playwright@1.55.0 screenshot             --browser=chromium             --viewport-size="1440,1000"             --wait-for-timeout=25000             "http://127.0.0.1:4173/?renderer=spark"             /tmp/maybeboudha-phase-2-spark.png

      - name: Capture PlayCanvas runtime
        run: |
          npx --yes playwright@1.55.0 screenshot             --browser=chromium             --viewport-size="1440,1000"             --wait-for-timeout=30000             "http://127.0.0.1:4173/?renderer=playcanvas"             /tmp/maybeboudha-phase-2-playcanvas.png

      - name: Upload runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-runtime-smoke
          path: /tmp/maybeboudha-phase-2-*.png
          if-no-files-found: warn
