name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
